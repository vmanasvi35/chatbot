<!DOCTYPE html>
<html>
<head>
  <title>Chatbot</title>
  <style>
    body { font-family: Arial; }
    #chatbox { width: 300px; height: 400px; border: 1px solid #ccc; overflow-y: auto; padding: 10px; color: black; }
    #userInput { color: black; }
    input { width: 70%; }
    button { width: 25%; }
  </style>
</head>
<body>

<h2>Weather Chatbot</h2>

<div id="chatbox"></div>

<input id="userInput" placeholder="Type message..." />
<button onclick="sendMessage()">Send</button>

<script>
// Fetch weather data on page load (NYC)
fetch("https://api.open-meteo.com/v1/forecast?latitude=40.7128&longitude=-74.0060&current=temperature_2m,weather_code")
  .then(res => res.json())
  .then(data => {
    window.weatherData = {
      city: "New York",
      temp: data.current.temperature_2m,
      condition: getWeatherCondition(data.current.weather_code)
    };
    console.log("Weather stored:", window.weatherData);
  })
  .catch(err => {
    console.error("Weather fetch error:", err);
    window.weatherData = {
      city: "New York",
      temp: 72,
      condition: "partly cloudy"
    };
  });

// Convert weather codes to readable conditions
function getWeatherCondition(code) {
  const conditions = {
    0: "clear sky",
    1: "mainly clear",
    2: "partly cloudy",
    3: "overcast",
    45: "foggy",
    48: "foggy",
    51: "light drizzle",
    53: "moderate drizzle",
    55: "heavy drizzle",
    61: "slight rain",
    63: "moderate rain",
    65: "heavy rain",
    71: "slight snow",
    73: "moderate snow",
    75: "heavy snow",
    80: "slight rain showers",
    81: "moderate rain showers",
    82: "violent rain showers",
    85: "slight snow showers",
    86: "heavy snow showers",
    95: "thunderstorm",
    96: "thunderstorm with slight hail",
    99: "thunderstorm with heavy hail"
  };
  return conditions[code] || "unknown";
}

async function sendMessage() {
  const input = document.getElementById("userInput");
  const message = input.value;

  if (!window.weatherData) {
    alert("Weather not loaded yet!");
    return;
  }

  console.log("Sending weather:", window.weatherData);

  const chatbox = document.getElementById("chatbox");
  chatbox.innerHTML += "<p><b>You:</b> " + message + "</p>";

  const response = await fetch("https://chatbot-0gdw.onrender.com/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: message,
      weather: window.weatherData
    })
  });

  const data = await response.json();
  chatbox.innerHTML += "<p><b>Bot:</b> " + data.reply + "</p>";

  input.value = "";
}
</script>

</body>
</html>
