<!DOCTYPE html>
<html>
<head>
  <title>Chatbot</title>
  <style>
    body { font-family: Arial; }
    #chatbox { width: 300px; height: 400px; border: 1px solid #ccc; overflow-y: auto; padding: 10px; color: black; }
    #userInput { color: black; }
    input { width: 70%; }
    button { width: 25%; }
  </style>
</head>
<body>

<h2>Chatbot</h2>

<div id="chatbox"></div>

<input id="userInput" placeholder="Type message..." />
<button onclick="sendMessage()">Send</button>

<script>
window.weatherData = null;

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "weather-data") {
    return;
  }

  window.weatherData = event.data.weather;
  console.log("Weather received from parent app:", window.weatherData);
});

async function sendMessage() {
  const input = document.getElementById("userInput");
  const message = input.value;

  console.log("Sending weather:", window.weatherData);

  const chatbox = document.getElementById("chatbox");
  chatbox.innerHTML += "<p><b>You:</b> " + message + "</p>";

  const baseUrl = window.location.origin; // Works for both localhost and production
  const response = await fetch(`${baseUrl}/chat`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: message,
      weather: window.weatherData
    })
  });

  const data = await response.json();
  chatbox.innerHTML += "<p><b>Bot:</b> " + data.reply + "</p>";

  input.value = "";
}
</script>

</body>
</html>
