<!DOCTYPE html>
<html>
<head>
  <title>Chatbot</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      color: #1f2937;
      font-family: Arial, sans-serif;
    }

    .chatApp {
      width: min(420px, 100vw);
      height: min(680px, 100vh);
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #d7dee8;
      box-shadow: 0 14px 40px rgba(20, 35, 60, 0.14);
    }

    .chatHeader {
      padding: 14px 16px;
      border-bottom: 1px solid #e5eaf1;
      background: #ffffff;
    }

    .chatTitle {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .chatSubtitle {
      margin: 4px 0 0;
      color: #65758b;
      font-size: 13px;
    }

    #chatbox {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #f8fafc;
    }

    .messageRow {
      display: flex;
      margin-bottom: 12px;
    }

    .messageRow.user {
      justify-content: flex-end;
    }

    .message {
      max-width: 82%;
      padding: 10px 12px;
      border-radius: 8px;
      line-height: 1.4;
      font-size: 14px;
      word-wrap: break-word;
    }

    .message.user {
      background: #2563eb;
      color: #ffffff;
    }

    .message.bot {
      background: #ffffff;
      color: #1f2937;
      border: 1px solid #e2e8f0;
    }

    .botMessage {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .speakerButton,
    .iconButton {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #1f2937;
      cursor: pointer;
      font-size: 17px;
    }

    .speakerButton {
      width: 30px;
      height: 30px;
      font-size: 14px;
      border-color: #e2e8f0;
    }

    .composer {
      padding: 12px;
      border-top: 1px solid #e5eaf1;
      background: #ffffff;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    #userInput {
      flex: 1;
      min-width: 0;
      height: 38px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0 10px;
      color: #1f2937;
      font-size: 14px;
    }

    #sendButton {
      width: 64px;
      height: 38px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
      font-weight: 700;
    }

    #sendButton:disabled {
      background: #93a4bd;
      cursor: not-allowed;
    }

    #micButton.listening {
      background: #e0f2fe;
      border-color: #38bdf8;
    }

    .voiceActions {
      display: none;
      gap: 6px;
      margin-top: 8px;
    }

    .voiceActions.show {
      display: flex;
    }

    .voiceActionButton {
      width: auto;
      height: 32px;
      padding: 0 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
    }

    .suggestions {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .suggestions.show {
      display: flex;
    }

    .suggestionButton {
      width: auto;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      color: #1f2937;
      padding: 7px 9px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<main class="chatApp">
  <header class="chatHeader">
    <h2 class="chatTitle">Chatbot</h2>
    <p id="chatSubtitle" class="chatSubtitle">Ask anything.</p>
  </header>

  <div id="chatbox"></div>

  <section class="composer">
    <div class="controls">
      <input id="userInput" placeholder="Type message..." />
      <button id="sendButton" onclick="sendMessage()">Send</button>
      <button id="micButton" class="iconButton" onclick="startVoiceInput()" title="Voice input">🎤</button>
    </div>

    <div id="voiceActions" class="voiceActions">
      <button class="voiceActionButton" onclick="acceptVoiceInput()">✓ Use voice text</button>
      <button class="voiceActionButton" onclick="cancelVoiceInput()">× Clear</button>
    </div>

    <div id="suggestions" class="suggestions">
      <button class="suggestionButton" onclick="askSuggestedQuestion('Should I carry an umbrella?')">Umbrella?</button>
      <button class="suggestionButton" onclick="askSuggestedQuestion('What should I wear today?')">What to wear?</button>
      <button class="suggestionButton" onclick="askSuggestedQuestion('Will it rain soon?')">Rain soon?</button>
      <button class="suggestionButton" onclick="askSuggestedQuestion('How does the weather feel outside?')">Feels like?</button>
    </div>
  </section>
</main>

<script>
window.weatherData = null;
let recognition = null;
let lastVoiceTranscript = "";
let isSending = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.addEventListener("start", () => {
    document.getElementById("micButton").classList.add("listening");
  });

  recognition.addEventListener("end", () => {
    document.getElementById("micButton").classList.remove("listening");
  });

  recognition.addEventListener("result", (event) => {
    lastVoiceTranscript = event.results[0][0].transcript;
    document.getElementById("userInput").value = lastVoiceTranscript;
    document.getElementById("voiceActions").classList.add("show");
  });

  recognition.addEventListener("error", (event) => {
    console.error("Voice input error:", event.error);
    alert("Voice input is not available right now. Please type your message.");
  });
} else {
  window.addEventListener("DOMContentLoaded", () => {
    document.getElementById("micButton").disabled = true;
    document.getElementById("micButton").title = "Voice input is not supported in this browser";
  });
}

window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("userInput").addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }
  });
});

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "weather-data") {
    return;
  }

  window.weatherData = event.data.weather;
  document.getElementById("suggestions").classList.add("show");
  document.getElementById("chatSubtitle").textContent = "Ask about the current weather or forecast.";
  console.log("Weather received from parent app:", window.weatherData);
});

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function scrollToLatest() {
  const chatbox = document.getElementById("chatbox");
  chatbox.scrollTop = chatbox.scrollHeight;
}

function addUserMessage(message) {
  const chatbox = document.getElementById("chatbox");
  chatbox.insertAdjacentHTML("beforeend", `
    <div class="messageRow user">
      <div class="message user">${escapeHTML(message)}</div>
    </div>
  `);
  scrollToLatest();
}

function addBotMessage(reply) {
  const chatbox = document.getElementById("chatbox");
  const safeReply = escapeHTML(reply);
  const encodedReply = encodeURIComponent(reply);

  chatbox.insertAdjacentHTML("beforeend", `
    <div class="messageRow bot">
      <div class="message bot botMessage">
        <span>${safeReply}</span>
        <button class="speakerButton" onclick="speakReply(decodeURIComponent('${encodedReply}'))" title="Read this reply aloud">🔊</button>
      </div>
    </div>
  `);
  scrollToLatest();
}

function addTypingMessage() {
  const chatbox = document.getElementById("chatbox");
  chatbox.insertAdjacentHTML("beforeend", `
    <div id="typingMessage" class="messageRow bot">
      <div class="message bot">Thinking...</div>
    </div>
  `);
  scrollToLatest();
}

function removeTypingMessage() {
  const typingMessage = document.getElementById("typingMessage");
  if (typingMessage) {
    typingMessage.remove();
  }
}

function setSendingState(sending) {
  isSending = sending;
  document.getElementById("sendButton").disabled = sending;
}

function startVoiceInput() {
  if (!recognition) {
    alert("Voice input is not supported in this browser.");
    return;
  }

  document.getElementById("voiceActions").classList.remove("show");
  recognition.start();
}

function acceptVoiceInput() {
  document.getElementById("voiceActions").classList.remove("show");
  sendMessage();
}

function cancelVoiceInput() {
  lastVoiceTranscript = "";
  document.getElementById("userInput").value = "";
  document.getElementById("voiceActions").classList.remove("show");
}

function speakReply(reply) {
  if (!window.speechSynthesis) {
    return;
  }

  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(reply);
  utterance.lang = "en-US";
  window.speechSynthesis.speak(utterance);
}

function askSuggestedQuestion(question) {
  document.getElementById("userInput").value = question;
  sendMessage();
}

async function sendMessage() {
  if (isSending) {
    return;
  }

  const input = document.getElementById("userInput");
  const message = input.value.trim();

  if (!message) {
    return;
  }

  console.log("Sending weather:", window.weatherData);

  addUserMessage(message);
  input.value = "";
  document.getElementById("voiceActions").classList.remove("show");
  setSendingState(true);
  addTypingMessage();

  try {
    const baseUrl = window.location.origin;
    const response = await fetch(`${baseUrl}/chat`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message,
        weather: window.weatherData
      })
    });

    const data = await response.json();
    removeTypingMessage();
    addBotMessage(data.reply);
  } catch (err) {
    console.error("Chat error:", err);
    removeTypingMessage();
    addBotMessage("Sorry, I could not answer right now. Please try again.");
  } finally {
    setSendingState(false);
  }
}
</script>

</body>
</html>
